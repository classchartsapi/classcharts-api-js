name: lint
on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "latest"
      - name: Lint Package with Biome
        run: deno task lint
